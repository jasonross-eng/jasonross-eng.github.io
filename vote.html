<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vote</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗳️</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap">
<style>
  /* Student vote page. Students type the code from the board and tap an answer.
     Answers travel through the free ntfy.sh relay: only the code, a random device id and the answer number, never a name. */
  :root { --bg:#160634; --card:#2a0f58; --ink:#f4f0ff; --soft:#c9bce6; --accent:#ffffff; --yellow:#f6c026; --font:"Andika", "Comic Sans MS", Arial, sans-serif; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font-family:var(--font); color:var(--ink); background:var(--bg); display:flex; flex-direction:column; align-items:center; }
  main { width:min(760px, 100%); flex:1; display:flex; flex-direction:column; gap:16px; padding:16px; }
  h1 { margin:8px 0 0; text-align:center; font-size:clamp(28px, 6vw, 48px); line-height:1.15; overflow-wrap:anywhere; }
  .msg { text-align:center; font-size:clamp(18px, 4vw, 26px); color:var(--soft); min-height:1.3em; }
  .code { display:flex; justify-content:center; gap:10px; }
  .code span { width:64px; height:80px; border-radius:16px; background:var(--card); display:flex; align-items:center; justify-content:center; font-size:48px; font-weight:700; border:3px solid #4a2a80; }
  .code span.on { border-color:var(--yellow); }
  .pad { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; width:min(360px, 100%); margin:0 auto; }
  .pad button, .opt, .go { font-family:var(--font); font-weight:700; border:none; cursor:pointer; color:var(--ink); background:var(--card); border-radius:18px; }
  .pad button { font-size:34px; padding:14px 0; }
  .pad button:active, .opt:active { transform:scale(.97); }
  .opts { display:flex; gap:12px; flex:1; }
  .opts.mc { flex-direction:column; }
  .opt { flex:1; min-height:90px; display:flex; align-items:center; justify-content:center; gap:14px; padding:12px 16px; font-size:clamp(22px, 5vw, 34px); border:4px solid transparent; }
  .opts:not(.mc) .opt { flex-direction:column; }
  .opt .em { font-size:clamp(56px, 14vw, 110px); line-height:1; }
  .opt .let { flex:0 0 auto; width:1.7em; height:1.7em; border-radius:50%; color:#1d2433; display:flex; align-items:center; justify-content:center; }
  .opt .tx { overflow-wrap:anywhere; }
  .opts.mc .opt { justify-content:flex-start; text-align:left; }
  .opt.picked { border-color:var(--yellow); background:#3d1a78; }
  .done { text-align:center; font-size:clamp(20px, 4.5vw, 30px); font-weight:700; color:var(--yellow); min-height:1.3em; }
  .go { align-self:center; font-size:18px; padding:8px 18px; background:transparent; border:2px solid #4a2a80; color:var(--soft); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <section id="enter">
    <h1>Type the code</h1>
    <p class="msg" id="enterMsg">It is on the board.</p>
    <div class="code" id="codeBoxes"><span></span><span></span><span></span><span></span></div>
    <div class="pad" id="pad"></div>
  </section>
  <section id="voteSec" hidden style="display:flex;flex-direction:column;gap:16px;flex:1">
    <h1 id="q"></h1>
    <div class="opts" id="opts"></div>
    <p class="done" id="done"></p>
    <p class="msg" id="voteMsg"></p>
    <button class="go" id="other">Use a different code</button>
  </section>
</main>
<script>
(function () {
  const RELAY = 'https://ntfy.sh/', PREFIX = 'jre-tb-';
  const COLORS = ['#22d3ee', '#7be0a2', '#f6c026', '#ff8a80', '#b48cff', '#ffb74d'];
  const $ = id => document.getElementById(id);
  const mem = {};
  const st = { get(k) { try { return localStorage.getItem(k); } catch(e) { return mem[k] || null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch(e) { mem[k] = v; } } };
  let dev = st.get('voteid'); if (!dev) { dev = Math.random().toString(36).slice(2, 12); st.set('voteid', dev); }
  let code = '', poll = null, es = null;

  // ---------- code entry ----------
  function paintCode() { $('codeBoxes').querySelectorAll('span').forEach((s, i) => { s.textContent = code[i] || ''; s.classList.toggle('on', i === code.length); }); }
  ['1','2','3','4','5','6','7','8','9','Clear','0','Back'].forEach(k => {
    const b = document.createElement('button'); b.textContent = k; if (k.length > 1) b.style.fontSize = '20px';
    b.onclick = () => {
      if (k === 'Clear') code = ''; else if (k === 'Back') code = code.slice(0, -1); else if (code.length < 4) code += k;
      paintCode(); if (code.length === 4) join();
    };
    $('pad').appendChild(b);
  });
  document.addEventListener('keydown', e => {
    if ($('enter').hidden) return;
    if (/^\d$/.test(e.key) && code.length < 4) { code += e.key; paintCode(); if (code.length === 4) join(); }
    if (e.key === 'Backspace') { code = code.slice(0, -1); paintCode(); }
  });

  // ---------- joining and voting ----------
  function show(sec) { $('enter').hidden = sec !== 'enter'; $('voteSec').hidden = sec !== 'vote'; }
  function useDef(d) {
    if (!d || d.closed) { poll = null; show('vote'); $('q').textContent = 'Voting is closed'; $('opts').innerHTML = ''; $('done').textContent = ''; $('voteMsg').textContent = 'Look at the board.'; return; }
    if (poll && poll.n === d.n) return;
    poll = d; render();
  }
  async function join() {
    $('enterMsg').textContent = 'Looking for the poll...';
    try {
      const r = await fetch(RELAY + PREFIX + code + '-q/json?poll=1&since=all');
      if (!r.ok) throw 0;
      const lines = (await r.text()).trim().split('\n').filter(Boolean);
      let last = null;
      lines.forEach(l => { try { const m = JSON.parse(l); if (!m.event || m.event === 'message') last = JSON.parse(m.message); } catch(e) {} });
      if (!last) { $('enterMsg').textContent = 'No poll with that code. Check the board and try again.'; code = ''; paintCode(); return; }
      history.replaceState(null, '', '?c=' + code);
      useDef(last); listen();
    } catch(e) { $('enterMsg').textContent = 'Cannot reach the vote service. Ask your teacher.'; code = ''; paintCode(); }
  }
  // new questions from the board show up by themselves
  function listen() {
    if (es) es.close();
    es = new EventSource(RELAY + PREFIX + code + '-q/sse?since=' + Math.floor(Date.now() / 1000));
    es.onmessage = e => { try { const m = JSON.parse(e.data); if (m.event && m.event !== 'message') return; useDef(JSON.parse(m.message)); } catch(x) {} };
  }
  function render() {
    show('vote');
    const mc = poll.type === 'mc', mine = st.get('vote_' + code + '_' + poll.n);
    $('q').textContent = poll.q || (mc ? 'Pick one' : 'Tap your answer');
    $('opts').className = 'opts' + (mc ? ' mc' : '');
    $('opts').innerHTML = '';
    poll.opts.forEach((o, i) => {
      const b = document.createElement('button'); b.className = 'opt' + (String(i) === mine ? ' picked' : '');
      if (mc) { const l = document.createElement('span'); l.className = 'let'; l.style.background = COLORS[i % 6]; l.textContent = String.fromCharCode(65 + i); b.appendChild(l); }
      else { const e = document.createElement('span'); e.className = 'em'; e.textContent = o[0]; b.appendChild(e); }
      const t = document.createElement('span'); t.className = 'tx'; t.textContent = o[1]; b.appendChild(t);
      b.onclick = () => vote(i, b);
      $('opts').appendChild(b);
    });
    $('done').textContent = mine !== null ? 'Thanks! You can tap another answer to change it.' : '';
    $('voteMsg').textContent = '';
  }
  let busy = false;
  async function vote(i) {
    if (busy || !poll) return; busy = true;
    try {
      const r = await fetch(RELAY + PREFIX + code + '-v', { method: 'POST', body: JSON.stringify({ n: poll.n, d: dev, a: i }) });
      if (!r.ok) throw 0;
      st.set('vote_' + code + '_' + poll.n, String(i)); render();
    } catch(e) { $('voteMsg').textContent = 'That did not go through. Try again.'; }
    setTimeout(() => busy = false, 800);
  }
  $('other').onclick = () => { if (es) es.close(); poll = null; code = ''; paintCode(); $('enterMsg').textContent = 'It is on the board.'; history.replaceState(null, '', location.pathname); show('enter'); };

  const c = new URLSearchParams(location.search).get('c');
  if (c && /^\d{4}$/.test(c)) { code = c; paintCode(); join(); } else paintCode();
})();
</script>
</body>
</html>
